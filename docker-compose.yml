# JARVIS Core - Production Docker Compose
# =============================================================================
# Phase F — F1 rebuild (2026-06-14)
#
# Co-tenant VPS (91.99.119.239, host "pana") — live bare-metal ERPNext on the
# host. Audited constraints (see docs/PHASE-F-F1-REBUILD-NOTES.md):
#   1. JARVIS does NOT bind host :80 / :443 (host nginx owns them; serves
#      Frappe on :80 and the JARVIS vhost on :443 after certbot-issue.sh).
#   2. `api` publishes on host 127.0.0.1:3001 ONLY (host nginx fronts it).
#   3. `hermes` is INTERNAL ONLY (no host port; reachable from api via
#      http://hermes:8765 on the jarvis-internal network).
#   4. `redis` is INTERNAL ONLY (no host :6379 publish).
#   5. `web` deploys to Vercel (https://jarvis.versalabs-studio.com) and is
#      NOT in this compose. The Vercel project sets
#      NEXT_PUBLIC_API_URL=https://api.jarvis.versalabs-studio.com.
#   6. The MCP services are profile-gated ('mcp') and INTERNAL ONLY.
#   7. The JARVIS `nginx` container is GONE — the host nginx is the front door.
#   8. No `ufw` step on the host (would sever Frappe's :8080/:9000); see
#      deploy/README.md.
#
# Supabase is HOSTED (project rofvgnvhmwsgrqewcbci) — no Supabase containers
# here. Migration 0004_role_grants.sql is already applied+verified on the
# hosted project (2026-06-13); do NOT re-run.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — least privilege (H1 fix)
  # Pinned to 0.3.0 (H2 — no :latest at runtime). INTERNAL ONLY.
  #
  # FIX B (Phase F Stage-2): NO `read_only: true`. The tecnativa:0.3.0
  # entrypoint regenerates /usr/local/etc/haproxy/haproxy.cfg from a
  # template in the same dir (which also holds errors/); a read-only
  # rootfs breaks it. Real hardening remains: docker.sock :ro mount,
  # env API-filter (EXEC=0, IMAGES=0, BUILD=0, …), internal-only network,
  # mem_limit 64m.
  # ---------------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: jarvis-socket-proxy
    environment:
      - CONTAINERS=1
      - POST=1
      - INFO=1
      - EXEC=0
      - IMAGES=0
      - VOLUMES=0
      - NETWORKS=0
      - BUILD=0
      - TASKS=0
      - SERVICES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      # FIX C (Phase F Stage-2): the tecnativa image ships wget but NOT
      # curl. Use wget.
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    networks:
      - jarvis-internal

  # ---------------------------------------------------------------------------
  # Redis — cache + BullMQ queue backend. INTERNAL ONLY.
  # No host port — only api + hermes on the jarvis-internal network reach it.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    networks:
      - jarvis-internal

  # ---------------------------------------------------------------------------
  # Hermes — workflow engine. INTERNAL ONLY (no host port).
  # Hardened (Phase E §5.5):
  #   - user 1001:1001 (non-root, sandbox §3.2)
  #   - cap_drop ALL + no-new-privileges
  #   - read_only rootfs with /app/tmp tmpfs
  #   - NO raw /var/run/docker.sock (must go through socket-proxy)
  # ---------------------------------------------------------------------------
  hermes:
    build:
      context: .
      dockerfile: apps/hermes/Dockerfile
    container_name: jarvis-hermes
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SKILLS_DIR=/app/data/skills
      - HERMES_DAILY_BUDGET_USD=0.50
      # E4 cron engine — writes workflow_runs via the API factory over HTTP
      # loopback (P2 — no direct Supabase in Hermes). API_URL is the docker
      # DNS for the api container; HERMES_SERVICE_TOKEN is the shared secret
      # the API's auth middleware checks on /api/cms/workflow_runs.
      - API_URL=http://api:3001
      - HERMES_SERVICE_TOKEN=${HERMES_SERVICE_TOKEN}
      # F2 — observability. Both optional; Sentry init no-ops if both unset.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-1.5.0}
    volumes:
      - hermes-data:/app/data
    user: "1001:1001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /app/tmp:size=64m,mode=1777
    restart: unless-stopped
    healthcheck:
      # Hermes listens on 0.0.0.0:8765 inside its namespace (default).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1700m  # §5.5 budget; bumped from 512m in the F1 rebuild
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - jarvis-internal

  # ---------------------------------------------------------------------------
  # API — Fastify server. LOOPBACK ONLY.
  # Host port 3001 is bound to 127.0.0.1 ONLY. The host nginx vhost
  # (deployed by deploy/certbot-issue.sh) is the public entry point at
  # https://api.jarvis.versalabs-studio.com → http://127.0.0.1:3001.
  #
  # CORS_ORIGINS is REQUIRED in production (the Vercel web origin). The
  # Zod schema in apps/api/src/lib/env.ts fail-loud at boot if it's unset
  # in production — see env.ts.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jarvis-api
    ports:
      # Loopback ONLY. The host nginx vhost is the public face.
      # If you `curl http://<host-public-ip>:3001` from outside, you get nothing.
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # Hermes is on the same docker network; reach it by name.
      - HERMES_URL=http://hermes:8765
      # Production CORS allow-origin (Vercel web). Comma-separate for
      # multiple origins (e.g. preview deployments).
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Public base URL of THIS API — used for OAuth redirects, webhook
      # callbacks, and the mobile app's EXPO_PUBLIC_API_URL.
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      # F2 — observability. Both optional; Sentry init no-ops if both unset.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - GLITCHTIP_DSN=${GLITCHTIP_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-1.5.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - jarvis-internal

  # ===========================================================================
  # MCP Servers (Phase E §5.3 E3 — single base image, per-server command override)
  #
  # INTERNAL ONLY — no host ports. Reachable from hermes via the docker DNS
  # names (http://mcp-<server>:8765) on the jarvis-internal network.
  #
  # Opt-in at runtime:  docker compose --profile mcp up -d
  # ===========================================================================
  jarvis-mcp-base:
    image: jarvis-mcp-base:latest
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
      args:
        MCP_SDK_VERSION: "1.0.4"
        MCP_GITHUB_VERSION: "0.6.0"
        MCP_NOTION_VERSION: "1.0.0"
        MCP_SUPABASE_VERSION: "1.0.0"
        MCP_BROWSER_VERSION: "0.0.1"
        MCP_FILESYSTEM_VERSION: "0.5.0"
        MCP_GMAIL_VERSION: "4.0.0"
    profiles: ["build"]
    mem_limit: 96m

  mcp-github:
    profiles: ["mcp"]
    image: jarvis-mcp-base:latest
    container_name: jarvis-mcp-github
    command: ["github"]
    env_file: [apps/mcp/github/.env]
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - jarvis-internal

  mcp-notion:
    profiles: ["mcp"]
    image: jarvis-mcp-base:latest
    container_name: jarvis-mcp-notion
    command: ["notion"]
    env_file: [apps/mcp/notion/.env]
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - jarvis-internal

  mcp-supabase:
    profiles: ["mcp"]
    image: jarvis-mcp-base:latest
    container_name: jarvis-mcp-supabase
    command: ["supabase"]
    env_file: [apps/mcp/supabase/.env]
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - jarvis-internal

  mcp-filesystem:
    profiles: ["mcp"]
    image: jarvis-mcp-base:latest
    container_name: jarvis-mcp-filesystem
    command: ["filesystem"]
    volumes:
      - .:/workspace:rw
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - jarvis-internal

  mcp-browser:
    profiles: ["mcp"]
    image: jarvis-mcp-base:latest
    container_name: jarvis-mcp-browser
    command: ["browser"]
    restart: unless-stopped
    mem_limit: 512m  # Chromium is memory-hungry
    networks:
      - jarvis-internal

  mcp-gmail:
    profiles: ["mcp"]
    image: jarvis-mcp-base:latest
    container_name: jarvis-mcp-gmail
    command: ["gmail"]
    env_file: [apps/mcp/gmail/.env]
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - jarvis-internal

  # Vercel and Linear are HOSTED (no local container). Hermes's
  # mcp-client.ts routes them to https://mcp.vercel.com and
  # https://mcp.linear.app via OAuth (F4 — needs Kidus's creds).

volumes:
  hermes-data:
    name: jarvis-hermes-data

networks:
  jarvis-internal:
    name: jarvis-internal
    driver: bridge
