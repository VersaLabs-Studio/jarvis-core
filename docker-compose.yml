# JARVIS Core - Production Docker Compose
# Supabase is HOSTED — no Supabase containers here
# Part 1 §1.4 topology: hermes, api, web, redis, nginx, docker-socket-proxy, MCP profiles

services:
  # Docker Socket Proxy — least privilege (H1 fix)
  # Pinned to 0.3.0 (H2 — no :latest at runtime)
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: jarvis-socket-proxy
    environment:
      - CONTAINERS=1
      - POST=1
      - INFO=1
      - EXEC=0
      - IMAGES=0
      - VOLUMES=0
      - NETWORKS=0
      - BUILD=0
      - TASKS=0
      - SERVICES=0
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    networks:
      - jarvis-internal

  # Redis — cache + queue backend
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    networks:
      - jarvis-internal

  # Hermes — workflow engine
  # Hardened (Phase E §5.5):
  #  - user 1001:1001 (non-root, sandbox §3.2)
  #  - cap_drop ALL + no-new-privileges
  #  - read_only rootfs with /app/tmp tmpfs
  #  - NO raw /var/run/docker.sock (must go through socket-proxy)
  hermes:
    build:
      context: .
      dockerfile: apps/hermes/Dockerfile
    container_name: jarvis-hermes
    environment:
      - NODE_ENV=production
      - PORT=8765
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SKILLS_DIR=/app/data/skills
      - HERMES_DAILY_BUDGET_USD=0.50
    volumes:
      - hermes-data:/app/data
    user: "1001:1001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /app/tmp:size=64m,mode=1777
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - jarvis-internal

  # API — Fastify server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: jarvis-api
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    networks:
      - jarvis-internal

  # Web — Next.js application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: jarvis-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 512m
    networks:
      - jarvis-internal

  # Nginx — reverse proxy
  nginx:
    image: nginx:alpine
    container_name: jarvis-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - jarvis-internal

  # MCP Servers (behind profiles — opt-in)
  mcp-github:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: apps/mcp-github/Dockerfile
    container_name: jarvis-mcp-github
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - jarvis-internal

  mcp-vercel:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: apps/mcp-vercel/Dockerfile
    container_name: jarvis-mcp-vercel
    environment:
      - VERCEL_TOKEN=${VERCEL_TOKEN}
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - jarvis-internal

volumes:
  hermes-data:
    name: jarvis-hermes-data

networks:
  jarvis-internal:
    name: jarvis-internal
    driver: bridge
