# JARVIS Core - Docker Compose Configuration
# Main compose file for all JARVIS services
# Version: 2.0 - Updated with MCP server support

services:
  # ===========================================
  # OpenClaw Gateway - Central orchestrator
  # ===========================================
  openclaw-gateway:
    image: openclaw:local
    container_name: jarvis-gateway
    ports:
      - "18789:18789"  # HTTP/WebSocket
      - "18790:18790"  # Internal
      - "18791:18791"  # Browser control
    volumes:
      - ./config:/home/node/.openclaw
      - openclaw-data:/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GATEWAY_TOKEN=${GATEWAY_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM}
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - jarvis-network
    depends_on:
      - mcp-github
      - mcp-notion
      - mcp-vercel
    profiles:
      - default
      - all

  # ===========================================
  # MCP Servers - Individual Integrations
  # ===========================================

  # GitHub MCP - Repository management, PRs, issues
  mcp-github:
    image: node:20-slim
    container_name: jarvis-mcp-github
    command: npx -y @modelcontextprotocol/server-github
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: unless-stopped
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 60s
      timeout: 5s
      retries: 2
    profiles:
      - mcp
      - all

  # Vercel MCP - Deployment, project management
  mcp-vercel:
    image: node:20-slim
    container_name: jarvis-mcp-vercel
    command: npx -y @vercel/mcp-server
    environment:
      - VERCEL_TOKEN=${VERCEL_TOKEN}
    restart: unless-stopped
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 60s
      timeout: 5s
      retries: 2
    profiles:
      - mcp
      - all

  # Notion MCP - Documentation, knowledge base
  mcp-notion:
    image: node:20-slim
    container_name: jarvis-mcp-notion
    command: npx -y @notionhq/notion-mcp-server
    environment:
      - NOTION_API_KEY=${NOTION_API_KEY}
    restart: unless-stopped
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 60s
      timeout: 5s
      retries: 2
    profiles:
      - mcp
      - all

  # Browser MCP - Web automation, research
  mcp-browser:
    image: node:20-slim
    container_name: jarvis-mcp-browser
    command: npx -y @anthropic/mcp-server-browser
    restart: unless-stopped
    networks:
      - jarvis-network
    profiles:
      - mcp
      - all

  # Gmail MCP - Email, calendar (disabled by default)
  mcp-gmail:
    image: node:20-slim
    container_name: jarvis-mcp-gmail
    command: npx -y @modelcontextprotocol/server-gmail
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
    restart: unless-stopped
    networks:
      - jarvis-network
    profiles:
      - mcp-gmail
      - all
    # Note: Requires OAuth setup - see mcp/gmail/README.md

# ===========================================
# Volumes
# ===========================================
volumes:
  openclaw-config:
    name: jarvis-openclaw-config
  openclaw-data:
    name: jarvis-openclaw-data

# ===========================================
# Networks
# ===========================================
networks:
  jarvis-network:
    name: jarvis-network
    driver: bridge