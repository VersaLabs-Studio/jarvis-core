# JARVIS - http{} context additions for the host nginx (Phase F F1)
# =============================================================================
# Co-tenant VPS rebuild. Drop into /etc/nginx/conf.d/jarvis-http.conf
# (idempotent — deploy/certbot-issue.sh does this; safe to re-run).
#
# The host's nginx.conf must `include /etc/nginx/conf.d/*.conf;` in its http{}
# block (Debian default). If the host uses a different include path, the
# operator can symlink or move this file there. deploy/setup-vps.sh patches
# the standard Debian nginx.conf to also `include` this file (one-time).
#
# This file is parsed in http{} context. Rate-limit zones (B3 fix) and the
# JARVIS API upstream live here; the server{} blocks live in
# nginx-jarvis-server.conf (80) and nginx-jarvis-https.conf (443; created by
# certbot-issue.sh AFTER the cert is issued).
# =============================================================================

# ---- Upstream: JARVIS API (bound to host loopback 127.0.0.1:3001 by compose) ----
upstream jarvis_api_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ---- Rate limit zones (B3 fix) ----
# Tight on the API surface; lenient on /health (monitoring) and /ws
# (long-lived WS connections).
limit_req_zone $binary_remote_addr zone=jarvis_api_limit:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=jarvis_ws_limit:10m    rate=5r/s;
limit_req_zone $binary_remote_addr zone=jarvis_health_limit:10m rate=30r/s;

# Global connection cap per IP (also used for WS long-lived connections)
limit_conn_zone $binary_remote_addr zone=jarvis_conn_limit:10m;
