# JARVIS - 443 (HTTPS) vhost for api.jarvis.versalabs-studio.com
# =============================================================================
# Co-tenant VPS rebuild. Drop into /etc/nginx/conf.d/jarvis-https.conf
# AFTER deploy/certbot-issue.sh has issued the cert (the file references
# /etc/letsencrypt/live/.../fullchain.pem which only exists after issuance).
#
# Proxies /api/* and /ws to 127.0.0.1:3001 (the API container, bound to host
# loopback by docker-compose.yml). Closes everything else with 444
# (nginx's "drop without a response" code) so the domain never serves a
# non-API surface.
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jarvis.versalabs-studio.com;

    # ---- TLS (Let's Encrypt; certbot-managed) ----
    ssl_certificate     /etc/letsencrypt/live/api.jarvis.versalabs-studio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jarvis.versalabs-studio.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.jarvis.versalabs-studio.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Security headers (always — applied to every response) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---- WebSocket: /ws (chat / realtime) ----
    location = /ws {
        limit_req zone=jarvis_ws_limit burst=10 nodelay;
        limit_conn jarvis_conn_limit 5;

        proxy_pass http://jarvis_api_backend/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Long-lived WS timeouts (24h ceiling)
        proxy_connect_timeout 60s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
    }

    # ---- API: /api/* ----
    location /api/ {
        limit_req zone=jarvis_api_limit burst=20 nodelay;
        limit_conn jarvis_conn_limit 10;

        proxy_pass http://jarvis_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;

        # Standard proxy timeouts (60s per request)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- Health: /health (the boot-smoke + monitoring) ----
    location = /health {
        access_log off;
        limit_req zone=jarvis_health_limit burst=60 nodelay;
        proxy_pass http://jarvis_api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Close everything else (no 404 page; nginx drops the connection) ----
    location / {
        return 444;
    }
}
