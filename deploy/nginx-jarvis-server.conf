# JARVIS - 80 (HTTP) vhost for api.jarvis.versalabs-studio.com
# =============================================================================
# Co-tenant VPS rebuild. Drop into /etc/nginx/conf.d/jarvis-80.conf
# (deploy/certbot-issue.sh does this; idempotent).
#
# This vhost is the ACME challenge endpoint for Let's Encrypt (certbot
# --webroot), the http→https redirect for everything else, AND the /health
# probe on port 80 (some monitoring agents don't speak TLS).
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.jarvis.versalabs-studio.com;

    # ACME challenge (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health probe on :80 (for monitoring agents that don't speak TLS).
    # The API's /health is unauthenticated and returns {status, version}.
    location = /health {
        access_log off;
        limit_req zone=jarvis_health_limit burst=60 nodelay;
        proxy_pass http://jarvis_api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 80 → 443 redirect (everything except ACME)
    location / {
        return 301 https://$host$request_uri;
    }
}
